<nav class="navbar navbar-expand-lg bg-primary fixed-top" color-on-scroll="500" role="navigation"
  [class.navbar-transparent]="!isScrolled" [class.navbar-solid]="isScrolled" [class.navbar-mobile-open]="sidebarVisible"
  aria-label="เมนูหลัก">
  <div class="container">
    <div class="navbar-translate">
      <a class="navbar-brand" [routerLink]="'/'" placement="bottom" aria-label="Twentysix.house">
        <img class="img-logo img-round mr-2" src="./assets/img/logobg.png" alt="Twentysix.house logo" />

        <span style="font-size: 15px;" class="font-le text-secoundary">
          Twentysix<span class="font-kn" style="font-size: 25px;">.</span>house
        </span>
      </a>

      <button class="navbar-toggler" type="button" aria-label="เปิดเมนู" (click)="sidebarToggle()">
        <span class="navbar-toggler-bar bar1"></span>
        <span class="navbar-toggler-bar bar2"></span>
        <span class="navbar-toggler-bar bar3"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse navbar-desktop-nav" data-color="primary" id="navbarToggler">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item" *ngFor="let link of navLinks" [class.nav-item-dropdown]="link.children?.length"
          [class.nav-item-dropdown--open]="openDropdownPath === link.path"
          [class.active]="isRouteActive(link.path, link.exact)">

          <ng-container *ngIf="!link.children?.length; else dropdownLink">
            <a class="nav-link" [routerLink]="link.path" (click)="onNavSelection($event)" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              [attr.aria-current]="isCurrentRoute(link.path) ? 'page' : null">
              <p>{{ link.label }}</p>
            </a>
          </ng-container>

          <ng-template #dropdownLink>
            <div class="nav-dropdown-wrap" (mouseenter)="openDropdown(link.path)"
              (mouseleave)="closeDropdown(link.path)" (focusin)="openDropdown(link.path)"
              (focusout)="onDropdownFocusOut($event, link.path)">
              <a class="nav-link nav-link-dropdown" [routerLink]="link.path" (click)="onNavSelection($event)"
                [attr.aria-current]="isRouteActive(link.path, link.exact) ? 'page' : null">
                <p>{{ link.label }}</p>
                <i class="fas fa-chevron-down nav-link-dropdown__icon" aria-hidden="true"></i>
              </a>

              <div class="nav-dropdown-menu" role="menu" aria-label="ผลงานของเรา">
                <a class="nav-dropdown-item" *ngFor="let child of link.children" [routerLink]="child.path"
                  (click)="onNavSelection($event)" [class.active]="isRouteActive(child.path, child.exact)"
                  [attr.aria-current]="isCurrentRoute(child.path) ? 'page' : null">
                  {{ child.label }}
                </a>
              </div>
            </div>
          </ng-template>
        </li>

        <li class="nav-item">
          <a class="nav-link btn btn-secondary btn-round m-0" [routerLink]="'/contact'" routerLinkActive="active"
            (click)="onNavSelection($event)" [routerLinkActiveOptions]="{ exact: true }"
            [attr.aria-current]="isCurrentRoute('/contact') ? 'page' : null">
            <p class="text-bold">ติดต่อเรา</p>
          </a>
        </li>
      </ul>

      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" title="Contact us on Line" data-placement="bottom" href="https://lin.ee/jzuOAtF"
            aria-label="Line" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-line"></i>
            <p class="d-lg-none d-xl-none">Line</p>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" title="Like us on Facebook" data-placement="bottom" aria-label="Facebook"
            href="https://www.facebook.com/share/19APWzVgu7/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-facebook-square"></i>
            <p class="d-lg-none d-xl-none">Facebook</p>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" title="Call Me" data-placement="bottom" href="tel:0994708877" target="_blank"
            rel="noopener noreferrer" aria-label="Call">
            <i class="fas fa-phone-alt"></i>
            <p class="d-lg-none d-xl-none">Tel</p>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <button type="button" class="navbar-mobile-backdrop" [class.is-open]="sidebarVisible"
    [attr.aria-hidden]="!sidebarVisible" aria-label="ปิดเมนู" (click)="sidebarClose()"></button>

  <aside class="navbar-mobile-panel" [class.is-open]="sidebarVisible" [attr.aria-hidden]="!sidebarVisible"
    aria-label="เมนูมือถือ">
    <button type="button" class="navbar-mobile-panel__close" aria-label="Close menu" (click)="sidebarClose()">
      <span class="navbar-mobile-panel__close-line navbar-mobile-panel__close-line--first"></span>
      <span class="navbar-mobile-panel__close-line navbar-mobile-panel__close-line--second"></span>
    </button>

    <div class="navbar-mobile-panel__content">
      <a class="navbar-mobile-panel__brand" [routerLink]="'/'" (click)="onNavSelection($event)">
        <img class="navbar-mobile-panel__brand-logo" src="./assets/img/logobg.png" alt="Twentysix.house logo" />
        <div class="navbar-mobile-panel__brand-copy">
          <span class="navbar-mobile-panel__brand-kicker font-le">TWENTYSIX.HOUSE</span>
          <!-- <span class="navbar-mobile-panel__brand-name">Twentysix.house</span>-->
        </div>
      </a>

      <div class="navbar-mobile-panel__nav">
        <ng-container *ngFor="let link of navLinks">
          <a *ngIf="!link.children?.length; else mobileGroup" class="navbar-mobile-panel__link" [routerLink]="link.path"
            (click)="onNavSelection($event)" [class.active]="isRouteActive(link.path, link.exact)">
            {{ link.label }}
          </a>

          <ng-template #mobileGroup>
            <div class="navbar-mobile-panel__group">
              <p class="navbar-mobile-panel__group-title">{{ link.label }}</p>
              <a class="navbar-mobile-panel__sublink" *ngFor="let child of link.children" [routerLink]="child.path"
                (click)="onNavSelection($event)" [class.active]="isRouteActive(child.path, child.exact)">
                {{ child.label }}
              </a>
            </div>
          </ng-template>
        </ng-container>
      </div>

      <div class="navbar-mobile-panel__footer">
        <a class="btn btn-secondary btn-round navbar-mobile-panel__cta" [routerLink]="'/contact'"
          (click)="onNavSelection($event)">
          ติดต่อเรา
        </a>

        <div class="navbar-mobile-panel__socials" aria-label="Social links">
          <a class="navbar-mobile-panel__social" href="https://lin.ee/jzuOAtF" target="_blank" rel="noopener noreferrer"
            aria-label="Line">
            <i class="fab fa-line" aria-hidden="true"></i>
          </a>
          <a class="navbar-mobile-panel__social" href="https://www.facebook.com/share/19APWzVgu7/?mibextid=wwXIfr"
            target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <i class="fab fa-facebook-f" aria-hidden="true"></i>
          </a>
          <a class="navbar-mobile-panel__social" href="tel:0994708877" aria-label="Call us">
            <i class="fas fa-phone-alt" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </aside>
</nav>
