<div class="wrapper">
  <div class="page-header page-header-small" style="background-image: url('./assets/img/blurred-image-1.jpg')">
    <div class="content-center">
      <div class="row">
        <div class="col-md-8 ml-auto mr-auto">
          <h2>Blog</h2>
          <h5 class="description text-gray">Written by Twentysix.house</h5>
          <div class="section-space"></div>
        </div>
      </div>
    </div>

  </div>
</div>
<div class="main" *ngIf="getBlogsById">
  <div class="section section-white">
    <div class="container">

      <div class="row">
        <div class="col-md-9 ml-auto mr-auto">
          <div class="text-center">;
            <a>
              <h3 class="title text-secondary">{{getBlogsById.title}}</h3>

            </a>
            <h4 class="title mb-5">{{getBlogsById.subTitle}}</h4>
          </div>
        </div>
        <div class="col-md-8 ml-auto mr-auto">
          <div class="row mb-4">
            <div class="col-md-12 text-center">
              <img style="width: 100%;" class="img img-raised" [src]="getBlogsById.pictureUrl" />
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <img alt="..." class=" img-circle img-no-padding img-responsive mr-2" src="assets/img/logo.jpg">
              TWENTTYSIX.HOUSE |
              {{getBlogsById.date }}
            </div>
          </div>
          <hr>
          <div class="article-content">

            <div class="row">

              <div class="col-12">
                <quill-view-html [content]="getBlogsById.content" theme="snow"></quill-view-html>
              </div>

            </div>

          </div><br>
          <div class="article-footer">

            <div class="row">
              <div class="col-md-12">
                <h5>Tags:</h5><span class="badge badge-primary mr-2 pl-3 pr-3"
                  *ngFor="let tags of getBlogsById.tags">{{tags}}</span>
              </div>

            </div>
          </div>
          <hr>

        </div>
      </div>

    </div>
  </div>
  <div class="section section-light">


    <div class="container">
      <div class="row">
        <div class="col-md-8 ml-auto mr-auto text-center">

          <h2 class="title text-primary">Related Blogs & Articles</h2>
          <div class="separator separator-primary"></div>

        </div>
      </div>
      <div class="line-separator separator-primary"></div>
      <div class="row mt-5">
        <div class="col-md-4 " *ngFor="let getBlog of getBlogs ">
          <div class="card card-blog">
            <div class="card-image">
              <a href="javascript:void(0)"><img class="img img-raised" [src]="getBlog.pictureUrl" /></a>
            </div>
            <div class="card-body">
              <h6 class="card-category text-primary"> {{getBlog.blogCategory.blogCategoryName}}</h6>
              <h3 class="card-title " (click)="onDetail(getBlog._id.$oid)">
                <a href="javascript:void(0)">{{getBlog.title}}</a>
              </h3>
              <p class="card-description">
                {{getBlog.subTitle}}
              </p>
              <hr />
              <div class="card-footer">
                <div class="author"><img alt="..." class="avatar img-raised" src="assets/img/logo.jpg"><span
                    class="text-secondary">TWENTYSIX.HOUSE</span>
                </div>
                <div class=" stats"> {{getBlog.date | date}} </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>


  </div>
</div>
