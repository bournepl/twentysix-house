<section class="services-section services-process" aria-labelledby="services-process-title">
  <div class="container">
    <header class="services-process__header text-center" data-aos="fade-up">
      <p class="services-section__kicker font-le">PROJECT JOURNEY</p>
      <h2 class="services-section__title font-kn" id="services-process-title">
        ขั้นตอนการทำงานที่ช่วยให้โครงการเดินชัดตั้งแต่ต้น
      </h2>
      <p class="services-section__description font-kn services-process__lead">
        เราแบ่งงานเป็นช่วงที่เข้าใจง่าย ตั้งแต่คุยโจทย์ ออกแบบ วางแผนก่อสร้าง
        ไปจนถึงตรวจรับและส่งมอบบ้าน
      </p>
    </header>

    <div class="services-process__timeline" role="list" data-aos="fade-up">
      <article class="services-process__step" *ngFor="let step of steps; let i = index" role="listitem">
        <div class="services-process__marker">
          <span class="services-process__number font-le">0{{ i + 1 }}</span>
        </div>

        <div class="services-process__body">
          <h3 class="services-process__step-title font-kn">{{ step.title }}</h3>
          <p class="services-process__step-description font-kn">{{ step.description }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
