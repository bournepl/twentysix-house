<section class="services-section services-cta" aria-labelledby="services-cta-title">
  <div class="container">
    <div class="services-cta__card" data-aos="fade-up">
      <div class="services-cta__glow" aria-hidden="true"></div>

      <div class="services-cta__content text-center">
        <p class="services-section__kicker font-le">NEXT STEP</p>
        <h2 class="services-section__title font-kn" id="services-cta-title">
          ถ้ากำลังวางแผนสร้างบ้าน ขั้นต่อไปคือการคุยโจทย์ของโครงการจริง
        </h2>
        <p class="services-section__description font-kn services-cta__lead">
          หากต้องการเริ่มต้นอย่างชัดเจนตั้งแต่การออกแบบ วางแผนงบประมาณ ไปจนถึงการก่อสร้าง
          ทีมของเราพร้อมช่วยดูภาพรวมของโครงการและแนะนำแนวทางที่เหมาะกับการใช้งานจริง
        </p>

        <div class="services-cta__highlights font-kn" aria-label="เหตุผลที่ควรเริ่มคุยกับทีมงาน">
          <span class="services-cta__highlight" *ngFor="let item of ctaPoints">{{ item }}</span>
        </div>

        <div class="services-cta__actions">
          <a class="btn btn-primary btn-round" routerLink="/contact">ปรึกษาโครงการ</a>
          <a class="btn btn-secondary btn-round" routerLink="/ourworks/real-projects">ดูผลงานจริง</a>
        </div>
      </div>
    </div>
  </div>
</section>
