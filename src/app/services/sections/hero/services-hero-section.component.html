<section class="page-header page-header-lg services-hero" aria-labelledby="services-hero-title">
  <div class="page-header-image rellax-header" data-rellax-speed="-10"
    style="background-image: url('assets/img/Collection/collection5.webp');"></div>

  <div class="container">
    <div class="services-hero__shell">
      <div class="services-hero__content text-center" data-aos="fade-up">
        <p class="services-hero__eyebrow font-le">OUR SERVICES</p>
        <h1 class="services-hero__title font-kn text-secondary" id="services-hero-title">
          บริการออกแบบและสร้างบ้านครบวงจร

        </h1>

        <div class="services-hero__breadcrumbs">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item font-kn" *ngFor="let crumb of breadcrumbs; let isLast = last"
                [class.active]="isLast" [attr.aria-current]="isLast ? 'page' : null">
                <a *ngIf="crumb.path; else lastCrumb" [routerLink]="crumb.path">{{ crumb.label }}</a>
                <ng-template #lastCrumb>{{ crumb.label }}</ng-template>
              </li>
            </ol>
          </nav>
        </div>

        <p class="services-hero__lead font-kn">
          Twentysix House ดูแลงานออกแบบ วางแผนงบประมาณ ก่อสร้าง และส่งมอบบ้าน
          เพื่อให้เจ้าของบ้านเห็นภาพรวมชัดตั้งแต่เริ่มต้น
        </p>

        <div class="services-hero__trust-list font-kn" aria-label="ขอบเขตบริการสำคัญของ Twentysix House">
          <span class="services-hero__trust-item" *ngFor="let point of trustPoints">{{ point }}</span>
        </div>

        <div class="services-hero__actions">
          <a class="btn btn-primary btn-round" [routerLink]="'/contact'">ปรึกษาโครงการ</a>
          <a class="btn btn-secondary btn-round" [routerLink]="'/ourworks/real-projects'">ดูผลงานจริง</a>
        </div>
      </div>
    </div>
  </div>
</section>
