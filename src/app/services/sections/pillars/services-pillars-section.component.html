<section class="services-section services-pillars" aria-labelledby="services-pillars-title">
  <div class="container">
    <header class="services-section__header text-center" data-aos="fade-up">
      <p class="services-section__kicker font-le">CORE SERVICES</p>
      <h2 class="services-section__title font-kn" id="services-pillars-title">
        บริการของเรา ครอบคลุมตั้งแต่เริ่มคิดจนถึงหลังส่งมอบ
      </h2>
      <p class="services-section__description font-kn">
        เลือกคุยเฉพาะบริการที่ต้องการ หรือให้ทีมช่วยวางภาพรวมทั้งโครงการตั้งแต่การออกแบบ
        วางแผนงบประมาณ ก่อสร้าง ไปจนถึงการดูแลหลังบ้านเสร็จ
      </p>

      <div class="services-pillars__tag-list font-kn" aria-label="ขอบเขตบริการหลัก">
        <span class="services-pillars__tag" *ngFor="let item of serviceTags">{{ item }}</span>
      </div>
    </header>

    <div class="services-pillars__grid">
      <article class="services-pillars__card" *ngFor="let item of pillars" data-aos="fade-up">
        <span class="services-pillars__icon" aria-hidden="true">
          <img class="services-pillars__icon-image" [src]="item.image" [alt]="item.alt" loading="lazy" />
        </span>

        <h3 class="services-pillars__title font-kn">{{ item.title }}</h3>
        <p class="services-pillars__description font-kn">{{ item.description }}</p>
      </article>
    </div>
  </div>
</section>
