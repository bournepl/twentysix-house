<section class="services-section services-quality" aria-labelledby="services-quality-title">
  <div class="container">
    <header class="services-quality__header text-center" data-aos="fade-up">
      <p class="services-section__kicker font-le">QUALITY & WARRANTY</p>
      <h2 class="services-section__title font-kn" id="services-quality-title">คุณภาพงานที่ตรวจเช็กได้ก่อนส่งมอบ</h2>
      <p class="services-section__description font-kn services-quality__lead">
        เราให้ความสำคัญกับรายละเอียดหน้างาน ความเรียบร้อยก่อนเข้าอยู่
        และข้อมูลที่ช่วยให้เจ้าของบ้านดูแลบ้านต่อได้อย่างมั่นใจ
      </p>
    </header>

    <div class="services-quality__trust-list font-kn" aria-label="จุดที่ช่วยสร้างความมั่นใจ" data-aos="fade-up">
      <span class="services-quality__trust-item" *ngFor="let point of trustPoints">{{ point }}</span>
    </div>

    <div class="services-quality__grid" role="list">
      <article class="services-quality__card" *ngFor="let item of qualityPoints" role="listitem" data-aos="fade-up">
        <span class="services-quality__icon" aria-hidden="true">
          <i [class]="item.icon"></i>
        </span>
        <h3 class="services-quality__item-title font-kn">{{ item.title }}</h3>
        <p class="services-quality__item-description font-kn">{{ item.description }}</p>
      </article>
    </div>
  </div>
</section>
