<section class="section home-services" aria-labelledby="services-title">
  <div class="container">
    <div class="row mb-3">
      <div class="col-lg-12 mb-5 mb-lg-0 services-header text-center" data-aos="fade-right">
        <p class="section-kicker font-le">Our Services</p>
        <h2 class="title text-primary font-kn services-title" id="services-title">
          บริการของเรา ครอบคลุมทั้งออกแบบ ก่อสร้าง และดูแลรายละเอียดของบ้าน
        </h2>
        <p class="description services-lead font-kn">
          เลือกคุยเฉพาะงานที่ต้องการ หรือให้เราช่วยดูภาพรวมตั้งแต่เริ่มวางแผนจนพร้อมก่อสร้าง
        </p>

        <div class="services-keywords font-kn" aria-label="บริการหลักของ Twentysix House">
          <span class="services-keyword" *ngFor="let keyword of serviceKeywords">{{ keyword }}</span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-12" data-aos="fade-up">
        <div class="services-grid">
          <article class="service-card" *ngFor="let service of services" data-aos="fade-up">
            <div class="service-icon-wrap">
              <img class="img-service" [src]="service.image" [alt]="service.alt" />
            </div>

            <p class="font-kn service-title">{{ service.title }}</p>
            <p class="font-kn service-description">{{ service.description }}</p>
          </article>
        </div>
      </div>
    </div>
  </div>
</section>
