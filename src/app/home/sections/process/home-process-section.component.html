<section class="section home-process" aria-labelledby="process-title">
  <div class="container">
    <header class="process-header text-center" data-aos="fade-up">
      <p class="section-kicker font-le">Process</p>
      <h2 class="title text-primary font-kn process-title" id="process-title">
        ขั้นตอนการทำงานที่ช่วยให้เจ้าของบ้านเห็นภาพชัดตั้งแต่เริ่มต้น
      </h2>
      <p class="description font-kn process-lead">
        เราจัดลำดับงานตั้งแต่คุยโจทย์ สำรวจพื้นที่ ออกแบบ วางงบประมาณ ก่อสร้าง ไปจนถึงส่งมอบบ้านจริง
      </p>
    </header>

    <div class="process-grid" role="list">
      <article class="process-card" *ngFor="let step of steps" role="listitem" data-aos="fade-up">
        <div class="process-icon-wrap">
          <span class="font-le process-number">{{ step.number }}</span>
          <i [class]="step.icon" aria-hidden="true"></i>
        </div>
        <p class="font-le process-card-kicker">{{ step.kicker }}</p>
        <p class="font-kn process-card-title">{{ step.title }}</p>
      </article>
    </div>
  </div>
</section>
