  <div class="section section-light" aria-labelledby="blogs-title">
    <div class="container">
      <div class="row">
        <div class="col-md-8 ml-auto mr-auto text-center">
          <header class="text-center mb-5">
            <p class="description" data-aos="fade-down">Blogs</p>
            <h2 class="title text-primary font-kn" data-aos="fade-down" id="blogs-title">บทความและสาระเรื่องบ้าน</h2>
            <div class="separator separator-primary" data-aos="fade-down"></div>
            <p class="description lead" data-aos="fade-down">
              ความรู้และประสบการณ์ด้านการออกแบบและสร้างบ้าน
              จากทีมงาน <strong>Twentysix.House</strong>
            </p>
          </header>
        </div>
      </div>
      <div class="line-separator separator-primary"></div>

      <div class="row">
        <div class="col-md-4 mb-3" *ngFor="let getBlog of blogs; trackBy: trackById">
          <article class="card card-blog" itemscope itemtype="https://schema.org/BlogPosting">

            <div class="card-image">
              <img class="img" [src]="getBlog.pictureUrl" [alt]="getBlog.title + ' | บทความโดย Twentysix.House'"
                itemprop="image" />
            </div>

            <div class="card-body">

              <meta itemprop="author" content="Twentysix.House">
              <meta itemprop="publisher" content="Twentysix.House">

              <p class="card-category text-primary" itemprop="articleSection">
                {{ getBlog.blogCategory.blogCategoryName }}
              </p>

              <h3 class="card-title" itemprop="headline">
                <a [routerLink]="getBlogUrl(getBlog)" itemprop="url"
                  [attr.aria-label]="'อ่านบทความ ' + getBlog.title">
                  {{ getBlog.title }}
                </a>
              </h3>

              <p class="card-description" itemprop="description">
                {{ getBlog.subTitle }}
              </p>

              <hr />

              <div class="card-footer">

                <div class="author">
                  <img class="avatar img-raised" src="assets/img/logo.jpg" alt="Twentysix.House">
                  <span class="text-secondary">TWENTYSIX.HOUSE</span>
                </div>

                <time class="stats" [attr.datetime]="getBlog.date" itemprop="datePublished">
                  {{ getBlog.date | date:'longDate' }}
                </time>

              </div>
            </div>

          </article>
        </div>
      </div>
    </div>
  </div>
