<section class="section home-contact" aria-labelledby="contact-title">
  <div class="container">
    <div class="contact-cta" data-aos="fade-up">
      <div class="contact-cta__background" aria-hidden="true"></div>
      <div class="contact-cta__overlay" aria-hidden="true"></div>

      <div class="contact-cta__content">
        <p class="section-kicker font-le">{{ contactIntro.kicker }}</p>
        <h2 class="contact-title font-kn" id="contact-title">{{ contactIntro.title }}</h2>
        <p class="contact-lead font-kn">{{ contactIntro.lead }}</p>

        <div class="contact-action-list" aria-label="ช่องทางติดต่อ Twentysix House">
          <ng-container *ngFor="let action of contactActions">
            <a *ngIf="action.isRouterLink; else externalAction" class="btn btn-round contact-action"
              [ngClass]="'contact-action--' + action.variant" [routerLink]="action.href">
              <i [class]="action.icon" aria-hidden="true"></i>
              <span>{{ action.label }}</span>
            </a>

            <ng-template #externalAction>
              <a class="btn btn-round contact-action" [ngClass]="'contact-action--' + action.variant"
                [href]="action.href" [attr.target]="action.target || null" [attr.rel]="action.rel || null">
                <i [class]="action.icon" aria-hidden="true"></i>
                <span>{{ action.label }}</span>
              </a>
            </ng-template>
          </ng-container>
        </div>
      </div>

      <aside class="contact-quick-card" aria-label="ข้อมูลที่ใช้เริ่มปรึกษา">
        <p class="contact-quick-card__label font-le">START WITH</p>
        <h3 class="contact-quick-card__title font-kn">ส่งข้อมูลสั้น ๆ มาให้ทีมงานช่วยดูได้</h3>
        <ul class="contact-quick-card__list font-kn">
          <li *ngFor="let item of quickStarts">{{ item }}</li>
        </ul>
      </aside>
    </div>
  </div>
</section>
