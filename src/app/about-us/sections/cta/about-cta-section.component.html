<section class="about-section about-cta" aria-labelledby="about-cta-title">
  <div class="container">
    <div class="about-cta__card" data-aos="fade-up">
      <div class="about-cta__glow" aria-hidden="true"></div>

      <div class="about-cta__content text-center">
        <p class="section-kicker font-le">NEXT STEP</p>
        <h2 class="section-title font-kn" id="about-cta-title">
          พร้อมเริ่มวางแผนบ้านของคุณแล้วหรือยัง
        </h2>
        <p class="section-description font-kn about-cta__lead">
          คุยกับทีม Twentysix House เพื่อประเมินโจทย์ งบประมาณ และแนวทางออกแบบก่อสร้างบ้านในอุดรธานีให้ชัดเจนตั้งแต่ต้น
        </p>

        <div class="about-cta__highlights font-kn" aria-label="เหตุผลที่ควรเริ่มคุยกับทีมงาน">
          <span class="about-cta__highlight" *ngFor="let item of highlights">{{ item }}</span>
        </div>

        <div class="about-cta__actions">
          <a class="btn btn-secondary btn-round" [routerLink]="'/contact'">ติดต่อทีมงาน</a>
          <a class="btn btn-outline-light btn-round about-cta__secondary-outline"
            [routerLink]="'/ourworks/real-projects'">ดูผลงานจริง</a>
          <a class="btn btn-outline-light btn-round about-cta__secondary-outline"
            [routerLink]="'/ourworks/house-designs'">ดูแบบบ้าน</a>
        </div>
      </div>
    </div>
  </div>
</section>
