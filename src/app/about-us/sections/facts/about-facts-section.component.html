<section class="about-section about-facts" aria-labelledby="about-facts-title">
  <div class="container">
    <div class="about-facts__head text-center" data-aos="fade-up">
      <p class="section-kicker font-le">COMPANY FACTS</p>
      <h2 class="section-title font-kn" id="about-facts-title">ข้อมูลบริษัทที่ตรวจสอบและติดต่อได้จริง</h2>
      <p class="section-description font-kn about-facts__lead">
        ข้อมูลพื้นฐานสำหรับเจ้าของบ้านที่ต้องการเริ่มคุยเรื่องแบบบ้าน งบประมาณ
        หรือนัดหมายกับทีมงาน Twentysix House ในจังหวัดอุดรธานี
      </p>
    </div>

    <div class="about-facts__trust-list font-kn" aria-label="ข้อมูลที่สร้างความมั่นใจ" data-aos="fade-up">
      <span class="about-facts__trust-item" *ngFor="let point of quickPoints">{{ point }}</span>
    </div>

    <div class="about-facts__grid" role="list">
      <article class="about-facts__card" *ngFor="let fact of facts" role="listitem" data-aos="fade-up">
        <div class="about-facts__icon" aria-hidden="true">
          <i class="now-ui-icons {{ fact.icon }}"></i>
        </div>
        <p class="about-facts__label font-kn">{{ fact.label }}</p>
        <h3 class="about-facts__value font-kn">{{ fact.value }}</h3>
        <p class="about-facts__copy font-kn">{{ fact.description }}</p>
      </article>
    </div>
  </div>
</section>
